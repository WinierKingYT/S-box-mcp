name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Validate repository files
        shell: pwsh
        run: ./scripts/validate-repository.ps1

      - name: Test the Claude stdio bridge and client templates
        shell: pwsh
        run: >
          dotnet test
          ./tools/SboxMcp.StdioBridge.Tests/SboxMcp.StdioBridge.Tests.csproj
          --configuration Release

      - name: Verify self-contained bridge publication
        shell: pwsh
        run: >
          dotnet publish
          ./tools/SboxMcp.StdioBridge/SboxMcp.StdioBridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output ./artifacts/bridge

      - uses: actions/upload-artifact@v7
        with:
          name: sbox-mcp-bridge-win-x64
          path: artifacts/bridge/SboxMcp.StdioBridge.exe
          if-no-files-found: error
